<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="traced.js"></script>
<style>
  /* Query options (override the saved look for one page): ?accent=%2300e0ff &skin=name|none &sides=1 &channels=0|1 &readout=0|1 &labels=0|1 &antenna=0|1 &shadow=0|1 &trail=0 &debug=1 &setup=1 */
  :root {
    --accent: #39ff88;
    --shell: rgba(58, 52, 47, 0.92);
    --shell-edge: rgba(255, 244, 230, 0.28);
    --plastic: #1d1e21;
    --plastic-edge: #3a3c41;
    --grip: #2b2c2f;
    --ink: #eef1f4;
    --dim: rgba(238, 241, 244, 0.55);
    --lcd: #d4e9f2;
    --lcd-ink: #17242c;
    --warn: #ffb020;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; color: var(--ink); }
  svg#root { display: block; width: 100vw; height: 100vh; }
  text { font-family: inherit; }
  .shell { fill: var(--shell); stroke: var(--shell-edge); stroke-width: 2; stroke-linejoin: round; }
  .plastic { fill: var(--plastic); stroke: var(--plastic-edge); stroke-width: 1.5; }
  .key { fill: #16171a; stroke: #45474d; stroke-width: 1.5; }
  .keytxt { fill: #9ea3aa; font-size: 9px; font-weight: 700; text-anchor: middle; font-style: italic; }
  .tag { fill: var(--ink); font-size: 15px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.75); stroke-width: 4px; }
  .tag .st { fill: var(--accent); }
  .knob { fill: url(#knurl); stroke: #8b9097; stroke-width: 1.5; }
  .shaft { stroke: #b9bec5; stroke-width: 7; stroke-linecap: round; }
  .stub { fill: #1a1b1e; stroke: #4a4c52; stroke-width: 1.5; }
  .cap { fill: url(#knurl); stroke: #8b9097; stroke-width: 1.5; }
  .caprib { stroke: rgba(0,0,0,.35); stroke-width: 1.5; }
  .trail { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: .45; }
  .guide { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 2 3; opacity: .55; }
  .tick { fill: var(--accent); }
  .lit { fill: var(--accent) !important; filter: url(#glow); }
  .litStroke { stroke: var(--accent) !important; filter: url(#glow); }
  .unmapped { opacity: .35; }
  .lcdtxt { fill: var(--lcd-ink); font-size: 10px; font-weight: 700; }
  .bar { fill: var(--accent); }
  .barbg { fill: rgba(0,0,0,.55); stroke: rgba(255,255,255,.15); }
  .chtxt { fill: var(--dim); font-size: 12px; paint-order: stroke; stroke: rgba(0,0,0,.8); stroke-width: 3px; }
  .chval { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: rgba(0,0,0,.8); stroke-width: 3px; }
  .btn { fill: rgba(0,0,0,.55); stroke: rgba(255,255,255,.2); }
  .readout { fill: var(--ink); font-size: 17px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.8); stroke-width: 5px; }
  .readout .k { fill: var(--dim); }
  .offline .dimmable { opacity: .35; }
  #skinWrap { display: none; }
  .skinned #skinWrap { display: inline; }
  #focus { display: none; pointer-events: none; }
  #focus circle { fill: none; stroke: var(--warn); stroke-width: 4; animation: pulse 1s ease-in-out infinite; }
  #focus line { stroke: var(--warn); stroke-width: 5; marker-end: url(#arrow); }
  @keyframes pulse { 50% { opacity: .25; } }
  #debug { position: fixed; left: 8px; bottom: 8px; color: #fff; background: rgba(0,0,0,.75); font: 12px monospace; padding: 6px 8px; white-space: pre; display: none; }

  /* ---- setup view ---- */
  /* The radio stays put and the settings scroll beside it (wide windows) or under it (narrow
     ones), so the control the wizard highlights is always in view. --draw-aspect is the
     drawing's width / height, set by applyParts. */
  body.setup { background: #0e0f11; display: grid; height: 100vh; }
  body.setup svg#root { width: 100%; height: 100%; min-width: 0; min-height: 0; }
  /* adjusting the shadow: a light checkerboard (OBS's see-through) behind the radio, so it shows */
  body.setup.shadow-preview svg#root { background: repeating-conic-gradient(#9aa1aa 0 25%, #b4bac2 0 50%) 0 0 / 24px 24px; }
  @media (min-aspect-ratio: 5/4) {
    body.setup { grid-template-columns: minmax(0, calc(100vh * var(--draw-aspect, .82))) minmax(320px, 1fr); }
  }
  @media not (min-aspect-ratio: 5/4) {
    body.setup { grid-template-rows: minmax(0, min(48vh, calc(100vw / var(--draw-aspect, .82)))) minmax(0, 1fr); }
  }
  #setup { display: none; padding: 12px max(clamp(12px, 4%, 20px), calc((100% - 1100px) / 2)) 24px; font-size: 14px;
           min-width: 0; min-height: 0; overflow-y: auto; container-type: inline-size; align-content: start; gap: 12px;
           /* room for the scrollbar kept either way, so opening something that makes it scroll moves nothing sideways */
           scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: #3a3c42 transparent; }
  body.setup #setup { display: grid; }
  #setup [hidden] { display: none !important; }
  .hint { color: var(--dim); }
  /* The radio and the LAN switch, then the OBS address, then a line about sharing it. Nothing
     in the first line changes with the switch and the last line is always there, so switching
     it moves neither the switch nor the cards under it. */
  .status { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; }
  .device { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .device b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status .obs, #lanNote { grid-column: 1 / -1; }
  #lanNote { font-size: 13px; min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lanNote.warn { white-space: normal; overflow-wrap: anywhere; } /* a reason it failed is read in full */
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555a61; flex: none; }
  .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.demo { background: var(--warn); }
  /* The OBS address stays on one line however long this PC's name is (cut short with …, in
     full on hover and when copied), so switching LAN never changes the header's height. On a
     narrow page it gets a line of its own under the size and Copy URL. */
  .obs { display: grid; grid-template-columns: auto minmax(0, max-content) auto auto; grid-template-areas: "label url size copy";
         justify-content: start; align-items: center; gap: 6px 8px; font-size: 13px; }
  .obs > .hint { grid-area: label; }
  #obsUrl { grid-area: url; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #obsSize { grid-area: size; white-space: nowrap; }
  #copyUrl { grid-area: copy; justify-self: start; }
  @container (max-width: 520px) {
    .obs { grid-template-columns: auto auto minmax(0, 1fr); grid-template-areas: "label size copy" "url url url"; }
  }
  .card { border: 1px solid #33363c; border-radius: 8px; padding: 12px 14px; background: #15161a; min-width: 0; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; margin: 0 0 12px; }
  .form { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 12px 16px; align-items: center; }
  .label { font-weight: 700; }
  .ctl { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; min-width: 0; }
  /* named switches in even columns: two by two, all in a row when there's room, one under the other on a phone */
  .switches { display: grid; grid-template-columns: repeat(2, max-content); gap: 10px 28px; }
  .switches .toggle { white-space: nowrap; }
  @container (min-width: 720px) { .switches { grid-template-columns: repeat(4, max-content); } }
  /* the shadow's sliders, under its switch: name, slider, value */
  .sliders { grid-column: 2; display: grid; grid-template-columns: max-content minmax(90px, 220px) 7ch; gap: 8px 12px;
             align-items: center; font-size: 13px; margin-top: -4px; }
  .sliders label { color: var(--dim); }
  .sliders output { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sliders .dir { display: inline-block; font-style: normal; margin-right: 4px; }
  .sliders button { grid-column: 1 / -1; justify-self: start; }
  #setup button[aria-expanded="true"] { border-color: var(--accent); }
  /* sliders drawn like the switches: a thin track, filled in the accent up to a round knob */
  #setup input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: transparent; cursor: pointer; }
  #setup input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--fill, 50%), #3a3c42 var(--fill, 50%)); }
  #setup input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border: 0; border-radius: 50%; background: #e9ecf1; }
  #setup input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #3a3c42; }
  #setup input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
  #setup input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: #e9ecf1; }
  #setup input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #setup input[type=range]:disabled { opacity: .4; cursor: not-allowed; }
  @container (max-width: 340px) { .switches { grid-template-columns: max-content; } }
  .cardhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .cardhead h2 { margin: 0; }
  .actions { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #setup select { font: inherit; background: #23252a; color: var(--ink); border: 1px solid #454850; border-radius: 6px; padding: 5px 8px; max-width: 100%; }
  #setup select:disabled { opacity: .45; cursor: not-allowed; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  #setup .swatch { width: 26px; height: 26px; border-radius: 50%; padding: 0; border: 2px solid rgba(0,0,0,.35); cursor: pointer;
                   box-shadow: 0 0 0 1px rgba(255,255,255,.18); transition: transform .12s; }
  #setup .swatch:hover { transform: scale(1.12); }
  #setup .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px #0e0f11, 0 0 0 4px var(--ink); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .toggle input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: #3a3c42; position: relative; cursor: pointer; margin: 0; transition: background .15s; }
  .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #e9ecf1; transition: transform .15s; }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::after { transform: translateX(16px); background: #0e0f11; }
  .toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .custom { display: inline-flex; align-items: center; gap: 8px; padding: 3px 12px 3px 3px; border: 1px solid #454850; border-radius: 999px;
            background: #23252a; cursor: pointer; font-variant-numeric: tabular-nums; }
  .custom input[type=color] { width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  .custom input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .custom input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .custom input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; }
  #setup button:focus-visible, .custom:focus-within, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  #setup button, #setup .filebtn { font: inherit; background: #23252a; color: var(--ink); border: 1px solid #454850; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #setup .small { padding: 3px 10px; font-size: 13px; }
  #setup button.primary { background: var(--accent); color: #07140c; border-color: transparent; font-weight: 700; }
  #setup button:disabled { opacity: .4; cursor: default; }
  #prompt { font-size: 19px; font-weight: 700; margin: 4px 0 2px; }
  #holdbar { height: 6px; background: #2a2c31; border-radius: 3px; overflow: hidden; margin: 10px 0 6px; }
  #holdbar div { height: 100%; width: 0; background: var(--accent); }
  #warn { color: var(--warn); min-height: 1.3em; }
  #found { font-size: 12px; margin-bottom: 8px; }
  .warn { color: var(--warn); }
  table { border-collapse: collapse; width: 100%; }
  td { text-align: left; padding: 4px 10px 4px 0; border-top: 1px solid #23252a; font-variant-numeric: tabular-nums; }
  td:last-child { padding-right: 0; white-space: nowrap; }
  th { text-align: left; padding: 0 10px 6px 0; font-size: 12px; font-weight: 400; color: var(--dim); white-space: nowrap; }
  th:last-child { padding-right: 0; }
  td.now { white-space: nowrap; }
  table:has(> tbody:empty) { display: none; } /* no header over nothing before the first update */
  /* where a switch lights up: a button per position, filled where it does; the ring is where it is now */
  .lights { display: inline-flex; gap: 4px; vertical-align: middle; margin: -2px 0; }
  #setup .lights button { width: 22px; height: 18px; padding: 0; border-radius: 4px; font-size: 12px; line-height: 1;
                          color: var(--dim); background: #1c1d21; border-color: #3a3c42; }
  #setup .lights button[aria-pressed="true"] { background: var(--accent); border-color: transparent; color: #07140c; font-weight: 700; }
  #setup .lights button.here { box-shadow: 0 0 0 1.5px #15161a, 0 0 0 3px var(--ink); }
  .mini { display: inline-block; width: 120px; height: 8px; background: #2a2c31; position: relative; vertical-align: middle; border-radius: 2px; margin-right: 6px; }
  .mini i { position: absolute; top: 0; bottom: 0; background: var(--accent); }
  /* a narrow settings column: the table's text wraps and the value bars shrink, so it never runs off the side */
  @container (max-width: 420px) { table { font-size: 12px; } td, th { padding-right: 6px; } .mini { width: 48px; } }
  /* a phone: the value bars go (the number stays), so the Lights up column fits */
  @container (max-width: 360px) { .mini { display: none; } }
  /* S1's travel as three parts, active | deadzone | active: tinted where it lights up, with
     a marker where S1 is now and a knob on each edge of the deadzone to drag */
  .zones { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #23252a; font-size: 13px; }
  .zlabel { font-weight: 700; white-space: nowrap; }
  .zbar { position: relative; flex: 1 1 auto; min-width: 110px; max-width: 320px; height: 10px; border-radius: 5px;
          background: #2a2c31; cursor: ew-resize; touch-action: none; }
  .zbar .z { position: absolute; top: 0; bottom: 0; background: #2a2c31; }
  .zbar .z.on { background: color-mix(in srgb, var(--accent) 55%, #2a2c31); }
  #zLow { left: 0; border-radius: 5px 0 0 5px; } #zHigh { right: 0; border-radius: 0 5px 5px 0; }
  .zbar .z.mid { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.09) 0 2px, transparent 2px 5px); }
  .zmark { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; pointer-events: none; }
  .zknob { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #e9ecf1;
           box-shadow: 0 0 0 2px #15161a; }
  .zknob:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* the deadzone typed in: a small box like the page's other fields */
  .zval { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #setup .zval input { width: 5ch; font: inherit; text-align: right; color: var(--ink); background: #23252a; border: 1px solid #454850;
                       border-radius: 6px; padding: 3px 6px; -moz-appearance: textfield; appearance: textfield; }
  #setup .zval input::-webkit-inner-spin-button, #setup .zval input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  #setup .zval input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* a phone: the name and the number on one line, the bar under them the whole width */
  @container (max-width: 360px) { .zones { flex-wrap: wrap; justify-content: space-between; } .zbar { order: 3; flex-basis: 100%; max-width: none; margin: 4px 7px; } }
  /* and the labels go above their controls */
  @container (max-width: 360px) { .form { grid-template-columns: minmax(0, 1fr); gap: 4px; } .ctl { margin-bottom: 8px; }
                                   .sliders { grid-column: auto; margin: 0 0 8px; } }
</style>
</head>
<body>
<svg id="root" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMin meet">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="knurl" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c3c8cf"/><stop offset="1" stop-color="#6d737b"/>
    </radialGradient>
    <radialGradient id="well" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#26282c"/><stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="shellShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,240,220,.10)"/><stop offset=".6" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.25)"/>
    </linearGradient>
    <pattern id="grille" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3" fill="#050506" stroke="#55585e" stroke-width="1"/>
    </pattern>
    <clipPath id="bodyClip"><path id="bodyClipPath"/></clipPath>
    <clipPath id="wheelClip"><ellipse cx="0" cy="0" rx="34" ry="16"/></clipPath>
    <clipPath id="wheelClipFront"><ellipse cx="0" cy="0" rx="19" ry="9"/></clipPath>
    <!-- the radio's shadow: its outline, blurred and moved the way it falls (applyShadowLook) -->
    <filter id="float" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur id="floatBlur" in="SourceAlpha"/>
      <feOffset id="floatOffset"/>
      <feComponentTransfer><feFuncA id="floatAlpha" type="linear"/></feComponentTransfer>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--warn)"/>
    </marker>
  </defs>

  <!-- ============ optional side views (?sides=1), traced from the side photo: SA and SE ============ -->
  <g id="sideL" class="dimmable" transform="translate(-447 115) scale(0.89)">
    <path class="shell side-body"/>
    <path class="side-grip" fill="var(--grip)" stroke="#45474c" stroke-width="1.5"/>
    <g id="seSide"><path class="plastic" d="M372 332 L420 300 L450 296 L458 318 L444 346 L396 366 L370 358 Z"/>
      <path d="M392 350 L436 318 M400 354 L442 324 M384 344 L428 312 M408 358 L446 332" stroke="#5a5d63" stroke-width="3"/></g>
    <g id="saSide" data-test="sa-side"><path class="plastic" d="M488 268 L540 256 L552 263 L548 298 L494 300 L486 292 Z"/></g>
  </g>

  <!-- ============ right side: mirror of the left: SD and S1 ============ -->
  <g id="sideR" class="dimmable" transform="translate(1447 115) scale(-0.89 0.89)">
    <path class="shell side-body"/>
    <path class="side-grip" fill="var(--grip)" stroke="#45474c" stroke-width="1.5"/>
    <g transform="translate(412 330) rotate(-28)">
      <ellipse class="plastic" cx="0" cy="0" rx="36" ry="18"/>
      <g clip-path="url(#wheelClip)"><g id="s1RibsSide"></g></g>
      <ellipse id="s1RimSide" cx="0" cy="0" rx="36" ry="18" fill="none" stroke="#6a6d73" stroke-width="2"/>
    </g>
    <g id="sdSide" data-test="sd-side"><path class="plastic" d="M488 268 L540 256 L552 263 L548 298 L494 300 L486 292 Z"/></g>
  </g>

  <!-- ============ front view (traced from the front photo) ============ -->
  <g id="front" class="dimmable">
    <!-- copies of the antenna and body, so the shadow follows them (a hidden antenna too) -->
    <g id="shadow" filter="url(#float)" pointer-events="none"><use id="shadowAntenna" href="#antenna"/><use href="#frontBody"/></g>
    <path id="antenna" fill="#2a2b2f" stroke="#4a4c52" stroke-width="2"/>
    <!-- SB / SC toggle nubs: height shows which way they're thrown -->
    <rect id="sbNub" data-test="sb-nub" class="plastic" x="348" width="29" rx="9"/>
    <rect id="scNub" data-test="sc-nub" class="plastic" x="624" width="29" rx="9"/>
    <path id="frontBody" class="shell"/>
    <!-- a skin wraps the body like a vinyl skin: any image, cropped to the radio's outline -->
    <g id="skinWrap" clip-path="url(#bodyClip)"><image id="skinImage" data-test="skin" preserveAspectRatio="xMidYMid slice"/></g>
    <path id="frontShade" fill="url(#shellShade)" pointer-events="none"/>
    <path id="frontOutline" fill="none" stroke="var(--shell-edge)" stroke-width="2" pointer-events="none"/>
    <!-- SA / SD shoulder paddles -->
    <path id="saFront" data-test="sa-front" class="plastic" d="M246 372 L310 351 L319 354 L318 362 L252 383 Z"/>
    <path id="sdFront" data-test="sd-front" class="plastic" d="M756 372 L692 351 L683 354 L684 362 L750 383 Z"/>
    <!-- SE (a pad on top, behind SA) and S1 (a wheel on the back, behind SD) can't be seen
         from the front, so they're drawn just off the top corners on their own side. -->
    <g id="seFront" transform="translate(206 336) rotate(-18)">
      <rect class="plastic" data-test="se-pad" x="-20" y="-9" width="40" height="18" rx="6"/>
      <path d="M-10 -5 V5 M-4 -6 V6 M2 -6 V6 M8 -5 V5" stroke="#5a5d63" stroke-width="2.5"/>
    </g>
    <g transform="translate(796 336) rotate(18)">
      <ellipse class="plastic" rx="21" ry="10"/>
      <g clip-path="url(#wheelClipFront)"><g id="s1RibsFront" data-test="s1-ribs"></g></g>

<script>
const q = new URLSearchParams(window.OVERLAY_QUERY ?? location.search);
if (q.has("accent")) document.documentElement.style.setProperty("--accent", q.get("accent"));
// Opened from another PC in the network (OBS on a streaming PC): it can only watch, so no
// settings there.
const OTHER_PC = /^https?:$/.test(location.protocol) && !["127.0.0.1", "localhost", "[::1]"].includes(location.hostname);
const SETUP = q.get("setup") === "1" && !OTHER_PC;
const SIDES = q.get("sides") === "1";
// ?readout=0/1, ?channels=0/1, ?labels=0/1, ?antenna=0/1 and ?shadow=0/1 override the saved choice for one page
const READOUT_PARAM = q.get("readout"), CHANNELS_PARAM = q.get("channels"), LABELS_PARAM = q.get("labels"),
  ANTENNA_PARAM = q.get("antenna"), SHADOW_PARAM = q.get("shadow");
const TRAIL = q.get("trail") === "0" ? 0 : Number(q.get("trail") || 20);
const DEBUG = q.get("debug") === "1";
const SKIN_PARAM = q.get("skin"); // a skin name, or "none" for the built-in drawing
const ACCENT_PARAM = q.get("accent"); // overrides the saved accent colour for this page
const DEFAULT_ACCENT = "#39ff88";
let shownAccent = null, accentPreview; // accentPreview: the setup page's pick until the server echoes it
let shownSkin, skinsRev;
if (SETUP) document.body.classList.add("setup");

const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const clamp = v => Math.max(-1, Math.min(1, v || 0));
const pct = v => { const n = Math.round(clamp(v) * 100); return (n > 0 ? "+" : "") + n; };

// ---------------- traced outlines ----------------
const T = window.TRACED || {};
$("frontBody").setAttribute("d", T.frontBody || "");
$("frontShade").setAttribute("d", T.frontBody || "");
$("frontOutline").setAttribute("d", T.frontBody || "");
$("bodyClipPath").setAttribute("d", T.frontBody || "");
{ // the wrap image covers the body's bounding box; the clip trims it to the outline
  const b = $("frontBody").getBBox();
  for (const [k, v] of Object.entries({ x: b.x, y: b.y, width: b.width, height: b.height })) $("skinImage").setAttribute(k, v);
}
$("antenna").setAttribute("d", T.frontAntenna || "");
document.querySelectorAll(".side-body").forEach(p => p.setAttribute("d", T.sideBody || ""));
document.querySelectorAll(".side-grip").forEach(p => p.setAttribute("d", T.sideGrip || ""));

// ---------------- layout ----------------
const vbTop = 175, vbLeft = SIDES ? -160 : 160, vbRight = SIDES ? 1162 : 842;
// Height of the drawing with or without the strip under the radio.
const vbHeight = (readout, channels) => 828 + (readout ? 44 : 0) + (channels ? 132 : 0) - vbTop;
// The OBS source height for a 680-wide source, rounded up to a round number: the radio is
// pinned to the top, so the few spare pixels are empty space at the bottom.
const obsHeight = (readout, channels) => Math.ceil(vbHeight(readout, channels) * 680 / 682 / 10) * 10; // OBS shows the 682-wide front view
let shownParts;
function applyParts(readout, channels) {
  const key = `${+readout}${+channels}`;
  if (key === shownParts) return;
  shownParts = key;
  $("readout").style.display = readout ? "" : "none";
  $("channels").style.display = channels ? "" : "none";
  $("channels").setAttribute("transform", readout ? "" : "translate(0 -38)");
  $("root").setAttribute("viewBox", `${vbLeft} ${vbTop} ${vbRight - vbLeft} ${vbHeight(readout, channels)}`);
  document.documentElement.style.setProperty("--draw-aspect", ((vbRight - vbLeft) / vbHeight(readout, channels)).toFixed(4));
  $("root").dataset.parts = key;
}
// The switch labels around the radio; they sit inside the drawing, so its size stays.
function applyLabels(labels) {
  $("tags").style.display = labels ? "" : "none";
  $("root").dataset.labels = +labels;
}
// The antenna leaves an empty space above the radio rather than moving it up in a scene.
function applyAntenna(antenna) {
  $("antenna").style.display = antenna ? "" : "none";
  $("root").dataset.antenna = +antenna;
}
function applyShadow(shadow) {
  $("shadow").style.display = shadow ? "" : "none";
  $("root").dataset.shadow = +shadow;
}
// How the shadow looks: which way it falls (degrees clockwise from straight up), how far,
// how soft and how dark (percent).
const SHADOW_DEFAULT = { angle: 180, distance: 11, blur: 6, strength: 60 };
const SHADOW_KEYS = Object.keys(SHADOW_DEFAULT);
const radioBox = (() => { // the body and antenna, which the shadow is cast from
  const a = $("frontBody").getBBox(), b = $("antenna").getBBox();
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  return { x, y, width: Math.max(a.x + a.width, b.x + b.width) - x, height: Math.max(a.y + a.height, b.y + b.height) - y };
})();
let shownShadowLook, shadowPreview; // shadowPreview: the setup page's pick until the server echoes it
function applyShadowLook(sh) {
  const key = SHADOW_KEYS.map(k => sh[k]).join(",");
  if (key === shownShadowLook) return;
  shownShadowLook = key;
  const rad = sh.angle * Math.PI / 180;
  $("floatBlur").setAttribute("stdDeviation", sh.blur);
  $("floatOffset").setAttribute("dx", (sh.distance * Math.sin(rad)).toFixed(2));
  $("floatOffset").setAttribute("dy", (-sh.distance * Math.cos(rad)).toFixed(2));
  $("floatAlpha").setAttribute("slope", sh.strength / 100);
  // a filter only paints inside its region: the radio, grown by as far as the shadow reaches
  const reach = sh.distance + 3 * sh.blur + 2;
  for (const [k, v] of Object.entries({ x: radioBox.x - reach, y: radioBox.y - reach,
    width: radioBox.width + 2 * reach, height: radioBox.height + 2 * reach })) $("float").setAttribute(k, v.toFixed(1));
  $("root").dataset.shadowLook = key;
}
function savedShadow(s) {
  const saved = s.shadow || SHADOW_DEFAULT;
  if (shadowPreview && SHADOW_KEYS.every(k => shadowPreview[k] === saved[k])) shadowPreview = undefined;
  return shadowPreview || saved;
}
const showPart = (param, saved) => (param === null ? saved : param !== "0");
let showPreview; // the setup page's pick until the server echoes it
function savedParts(s) {
  const saved = { readout: s.show_readout !== false, channels: s.show_channels !== false,
                  labels: s.show_labels !== false, antenna: s.show_antenna !== false, shadow: s.show_shadow !== false };
  if (showPreview && Object.keys(saved).every(k => showPreview[k] === saved[k])) showPreview = undefined;
  return showPreview || saved;
}
applyParts(showPart(READOUT_PARAM, true), showPart(CHANNELS_PARAM, true));
applyLabels(showPart(LABELS_PARAM, true));
applyAntenna(showPart(ANTENNA_PARAM, true));
applyShadow(showPart(SHADOW_PARAM, true));
applyShadowLook(SHADOW_DEFAULT);
if (!SIDES) { $("sideL").style.display = "none"; $("sideR").style.display = "none"; }
if (DEBUG) $("debug").style.display = "block";

// ---------------- static face details ----------------
[["RTN", 635], ["PAGE<", 671], ["PAGE>", 704], ["TELE", 737]].forEach(([t, y]) => {
  el("rect", { x: 308, y: y - 13, width: 44, height: 26, rx: 13, class: "key" }, $("leftKeys"));
  el("text", { x: 330, y: y + 3, class: "keytxt" }, $("leftKeys")).textContent = t;
});
for (const [id, cx] of [["trimL", 423], ["trimR", 577]]) {
  const g = $(id);
  el("circle", { cx, cy: 620, r: 24, class: "key" }, g);
  el("path", { d: `M${cx - 11} 620 H${cx + 11} M${cx} 609 V631`, stroke: "#5b5e64", "stroke-width": 5, "stroke-linecap": "round" }, g);
}

// ---------------- gimbals (front) ----------------
// Drawn like the Pocket's gimbals (measured on the product photo), looking down on the stick:
// a black opening in the bezel with a drum inside it on a fixed left-right axle. Up/down
// swivels the drum, so its slot rolls up/down and foreshortens as it turns away; the stick
// leans through the slot, so its knob travels further than the slot does. Left/right
// swivels the stick along the slot. The knob's position is linear in the channel value.
const TRAVEL_X = 40, TRAVEL_Y = 40;          // knob (stick top) travel
const OPEN_W = 114, OPEN_H = 92, DRUM_R = 46;
const SWING = 0.5;                           // sine of the stick's full-throw angle (30 deg)
const LEAN = DRUM_R * SWING / TRAVEL_Y;      // slot movement relative to the knob's
function buildGimbal(g, cx, cy, side) {
  el("circle", { cx, cy, r: 82, fill: "#0c0c0e", stroke: "#4a4c52", "stroke-width": 2 }, g);
  el("circle", { cx, cy, r: 76, fill: "none", stroke: "#1f2024", "stroke-width": 5 }, g);
  const ox = cx - OPEN_W / 2, oy = cy - OPEN_H / 2;
  const defs = el("defs", {}, g);
  const clip = el("clipPath", { id: `opening-${side}` }, defs);
  el("rect", { x: ox, y: oy, width: OPEN_W, height: OPEN_H, rx: 11 }, clip);
  // the drum, lit from the front-bottom like in the photo; the light doesn't turn with it
  const shade = el("linearGradient", { id: `drum-${side}`, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: 0, "stop-color": "#060607" }, shade);
  el("stop", { offset: 0.45, "stop-color": "#16171a" }, shade);
  el("stop", { offset: 1, "stop-color": "#3a3b40" }, shade);

  const inside = el("g", { "clip-path": `url(#opening-${side})` }, g);
  el("rect", { x: ox, y: oy, width: OPEN_W, height: OPEN_H, fill: `url(#drum-${side})` }, inside);
  const ribs = el("path", { stroke: "rgba(255,255,255,.07)", "stroke-width": 1.5, fill: "none" }, inside);
  const frame = el("rect", { x: cx - 50, width: 100, rx: 6, fill: "#3a3b40", stroke: "#4c4e54", "stroke-width": 1.5 }, inside);
  const slot = el("rect", { "data-test": `slot-${side}`, x: cx - 43, width: 86, rx: 8, fill: "#050506", stroke: "#1c1d20", "stroke-width": 1.5 }, inside);
  const trail = el("polyline", { class: "trail" }, inside);
  // axle ends: fixed, they don't move with the drum
  el("rect", { x: ox - 8, y: cy - 5, width: 10, height: 10, rx: 2, fill: "#3a3b40" }, g);
  el("rect", { x: ox + OPEN_W - 2, y: cy - 5, width: 10, height: 10, rx: 2, fill: "#3a3b40" }, g);
  el("rect", { x: ox, y: oy, width: OPEN_W, height: OPEN_H, rx: 11, fill: "none", stroke: "#2c2e33", "stroke-width": 2 }, g);

  // test hook: the range the knob's centre covers (-1..1 on each axis)
  el("rect", { "data-test": `travel-${side}`, x: cx - TRAVEL_X, y: cy - TRAVEL_Y, width: 2 * TRAVEL_X, height: 2 * TRAVEL_Y, fill: "none" }, g);

  // value ticks: X under the opening, Y on the outer side
  const edgeX = side === "L" ? ox - 17 : ox + OPEN_W + 17;
  const guideX = el("line", { class: "guide" }, g), guideY = el("line", { class: "guide" }, g);
  const tickX = el("path", { class: "tick", "data-test": `tickx-${side}` }, g);
  const tickY = el("path", { class: "tick", "data-test": `ticky-${side}` }, g);
  const shaft = el("line", { class: "shaft", "data-test": `shaft-${side}` }, g);
  const knob = el("circle", { class: "knob", "data-test": `knob-${side}`, cx, cy, r: 14 }, g);
  return { cx, cy, side, edgeX, bottom: oy + OPEN_H + 14, ribs, frame, slot, shaft, guideX, guideY, tickX, tickY, trail, knob, pts: [] };
}
const gL = buildGimbal($("gimbalL"), 331, 523, "L");
const gR = buildGimbal($("gimbalR"), 672, 521, "R");

// Projected top and bottom of a band on the drum, `half` px high when facing the camera.
function drumBand(cy, phi, half) {
  const d = Math.asin(half / DRUM_R);
  return [cy - DRUM_R * Math.sin(phi + d), cy - DRUM_R * Math.sin(phi - d)];
}

function drawGimbal(g, s) {
  const sx = clamp(s.x), sy = clamp(s.y);
  const x = g.cx + sx * TRAVEL_X, y = g.cy - sy * TRAVEL_Y; // up on the stick = up on screen
  const phi = Math.asin(sy * SWING);                       // how far the drum has turned

  const [ft, fb] = drumBand(g.cy, phi, 20);
  g.frame.setAttribute("y", ft.toFixed(2)); g.frame.setAttribute("height", (fb - ft).toFixed(2));
  const [st, sb] = drumBand(g.cy, phi, 15);
  g.slot.setAttribute("y", st.toFixed(2)); g.slot.setAttribute("height", (sb - st).toFixed(2));
  // faint lines around the drum, bunching up towards its edges as it turns
  let d = "";
  for (let i = -8; i <= 8; i++) {
    const a = phi + i * 0.22;
    if (Math.abs(a) < 1.45) {
      const ry = (g.cy - DRUM_R * Math.sin(a)).toFixed(2);
      d += `M${g.cx - 57} ${ry} H${g.cx + 57}`;
    }
  }
  g.ribs.setAttribute("d", d);

  // the stick leans through the slot: it leaves the drum closer in than its knob
  const ex = g.cx + sx * TRAVEL_X * LEAN, ey = g.cy - sy * TRAVEL_Y * LEAN;
  g.shaft.setAttribute("x1", ex.toFixed(2)); g.shaft.setAttribute("y1", ey.toFixed(2));
  g.shaft.setAttribute("x2", x.toFixed(2)); g.shaft.setAttribute("y2", y.toFixed(2));
  g.knob.setAttribute("cx", x); g.knob.setAttribute("cy", y);

  g.tickX.setAttribute("d", `M${x} ${g.bottom - 5} l5 8 h-10 Z`);
  const dir = g.side === "L" ? 1 : -1; // tick points inward
  g.tickY.setAttribute("d", `M${g.edgeX + 5 * dir} ${y} l${-8 * dir} 5 v-10 Z`);
  g.guideX.setAttribute("x1", x); g.guideX.setAttribute("y1", y); g.guideX.setAttribute("x2", x); g.guideX.setAttribute("y2", g.bottom - 5);
  g.guideY.setAttribute("x1", x); g.guideY.setAttribute("y1", y); g.guideY.setAttribute("x2", g.edgeX + 5 * dir); g.guideY.setAttribute("y2", y);

  if (TRAIL) {
    g.pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    if (g.pts.length > TRAIL) g.pts.shift();
    g.trail.setAttribute("points", g.pts.join(" "));
  }
}

// ---------------- side views (optional) ----------------
// Paddles pivot at their base: position 0 (up/away from the pilot) leans back, 1 leans to the face.
const paddle = (id, pos) => $(id).setAttribute("transform", pos == null ? "" : `rotate(${pos ? 14 : -14} 520 300)`);
// S1 wheels: ribs that roll sideways with the value (front: small, side: large)

// ---------------- setup: what to highlight for each wizard step ----------------
const FOCUS = {
  left_y: [331, 523, 95, [0, -1]], left_x: [331, 523, 95, [1, 0]],
  right_y: [672, 521, 95, [0, -1]], right_x: [672, 521, 95, [1, 0]],
  SA: [282, 367, 42], SB: [362, 332, 30], SC: [638, 332, 30], SD: [720, 367, 42],
  SE: [206, 336, 34], S1: [796, 336, 34],
};
function drawFocus(target) {
  const f = FOCUS[target];
  $("focus").style.display = f ? "block" : "none";
  if (!f) return;
  const [x, y, r, dir] = f;
  const c = $("focus").querySelector("circle"), l = $("focus").querySelector("line");
  c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", r);
  l.style.display = dir ? "" : "none";
  if (dir) {
    l.setAttribute("x1", x + dir[0] * 20); l.setAttribute("y1", y + dir[1] * 20);
    l.setAttribute("x2", x + dir[0] * (r - 8)); l.setAttribute("y2", y + dir[1] * (r - 8));
  }
}

// ---------------- render ----------------
// Which stick axis each function is on, per transmitter mode.
const STICK_MODES = {
  1: { THR: ["right", "y"], RUD: ["left", "x"], ELE: ["left", "y"], AIL: ["right", "x"] },
  2: { THR: ["left", "y"], RUD: ["left", "x"], ELE: ["right", "y"], AIL: ["right", "x"] },
  3: { THR: ["right", "y"], RUD: ["right", "x"], ELE: ["left", "y"], AIL: ["left", "x"] },
  4: { THR: ["left", "y"], RUD: ["right", "x"], ELE: ["right", "y"], AIL: ["left", "x"] },
};
const ARROW ={ 2: ["↑", "↓"], 3: ["↑", "–", "↓"] };
const swText = (pos, n) => pos == null ? "n/a" : ARROW[n][pos];
// Where S1 is, for lighting it up: 0 below its deadzone, 1 in it, 2 above (dz: percent
// either side of its middle).
const s1Zone = (v, dz) => v == null ? null : v < -dz / 100 ? 0 : v > dz / 100 ? 2 : 1;
let s1DzPreview; // the setup page's pick until the server echoes it
function s1Deadzone(s) {
  const saved = s.s1_deadzone ?? 2;
  if (s1DzPreview === saved) s1DzPreview = undefined;
  return s1DzPreview ?? saved;
}
function mapped(id, v) { $(id).classList.toggle("unmapped", v == null); }

function render(s) {
  const root = $("root");
  applySkin(SKIN_PARAM === "none" ? null : SKIN_PARAM || s.skin || null, s.skin_rev || 0);
  if (accentPreview !== undefined && (s.accent || null) === accentPreview) accentPreview = undefined;
  if (!ACCENT_PARAM) applyAccent(accentPreview !== undefined ? accentPreview : s.accent || null);
  root.classList.toggle("offline", !s.connected);
  $("power").setAttribute("stroke", s.connected ? "var(--accent)" : "#3a3c41");
  $("power").style.filter = s.connected ? "url(#glow)" : "";

  drawGimbal(gL, s.left); drawGimbal(gR, s.right);

  // Each switch lights up in the positions picked on the settings page (s.lit): by default
  // SA and SD toward the pilot, SB and SC at either end, SE pressed, S1 off its middle.
  const lights = (key, pos) => pos != null && !!s.lit?.[key]?.[pos];
  paddle("saSide", s.sa); paddle("sdSide", s.sd);
  for (const [id, key, v] of [["saFront", "SA", s.sa], ["sdFront", "SD", s.sd], ["saSide", "SA", s.sa], ["sdSide", "SD", s.sd]]) {
    mapped(id, v);
    const shape = id.endsWith("Side") ? $(id).firstElementChild : $(id);
    shape.classList.toggle("lit", lights(key, v));
  }
  nub("sbNub", s.sb); nub("scNub", s.sc);
  mapped("sbNub", s.sb); mapped("scNub", s.sc);
  $("sbNub").classList.toggle("lit", lights("SB", s.sb));
  $("scNub").classList.toggle("lit", lights("SC", s.sc));

  for (const id of ["seFront", "seSide"]) {
    mapped(id, s.se);
    $(id).querySelector(".plastic").classList.toggle("lit", lights("SE", s.se));
  }
  $("seSide").setAttribute("transform", s.se === 1 ? "translate(2 4)" : "");

  // S1: ribs roll with the value; the rim lights once it's off centre
  for (const [ribsId, rimId, , , travel] of S1_WHEELS) {
    $(ribsId).setAttribute("transform", `translate(${(clamp(s.s1 ?? 0) * travel).toFixed(2)} 0)`);
    $(rimId).classList.toggle("litStroke", lights("S1", s1Zone(s.s1, s1Deadzone(s))));
    mapped(ribsId, s.s1);
  }

  // With no signal every label goes blank rather than showing a position nobody set.
  const live = s.connected;
  tags.sb.textContent = live ? swText(s.sb, 3) : "";
  tags.sc.textContent = live ? swText(s.sc, 3) : "";
  tags.sa.textContent = live ? swText(s.sa, 2) : "";
  tags.sd.textContent = live ? swText(s.sd, 2) : "";
  if (tags.se) tags.se.textContent = !live ? "" : s.se == null ? "n/a" : (s.se ? "●" : "○");
  if (tags.s1) tags.s1.textContent = !live ? "" : s.s1 == null ? "n/a" : pct(s.s1);

  lcdTitle.textContent = s.connected ? (s.name || "EdgeTX").replace(/ Joystick$/, "").slice(0, 22) : "NO USB SIGNAL";
  lcdBars.forEach((b, i) => {
    const len = ((s.channels[i] ?? 0) / 1024) * 26;
    b.bar.setAttribute("x", b.x + Math.min(0, len)); b.bar.setAttribute("width", Math.abs(len));
  });

  const parts = savedParts(s);
  applyParts(showPart(READOUT_PARAM, parts.readout), showPart(CHANNELS_PARAM, parts.channels));
  applyLabels(showPart(LABELS_PARAM, parts.labels));
  applyAntenna(showPart(ANTENNA_PARAM, parts.antenna));
  applyShadow(showPart(SHADOW_PARAM, parts.shadow));
  applyShadowLook(savedShadow(s));
  if (!s.connected) {
    readoutText.replaceChildren();
    el("tspan", { class: "k" }, readoutText).textContent = "NO SIGNAL";
  } else {
    readoutText.replaceChildren();
    const axes = STICK_MODES[s.mode] || STICK_MODES[2];
    const val = name => { const [stick, axis] = axes[name]; return s[stick][axis]; };
    const text = [["THR ", Math.round((clamp(val("THR")) + 1) * 50) + "%"], ["  RUD ", pct(val("RUD"))],
                  ["  ELE ", pct(val("ELE"))], ["  AIL ", pct(val("AIL"))]];
    for (const [k, v] of text) {
      el("tspan", { class: "k" }, readoutText).textContent = k;
      el("tspan", {}, readoutText).textContent = v;
    }
  }
  chEls.forEach((e, i) => {
    const raw = s.channels[i] ?? 0, half = e.w / 2, len = clamp(raw / 1024) * half;
    e.bar.setAttribute("x", e.x + half + Math.min(0, len));
    e.bar.setAttribute("width", Math.abs(len));
    e.val.textContent = (raw / 10.24).toFixed(1) + "%";
  });
  btnEls.forEach((b, i) => b.classList.toggle("lit", (s.channels[i + 8] ?? 0) > 0));

  if (SETUP) renderSetup(s);
  if (DEBUG) $("debug").textContent = "channels: " + s.channels.map((v, i) => `${i + 1}:${v}`).join(" ");

  // test hooks: which input this frame shows
  root.dataset.channels = s.channels.join(",");
  root.dataset.lit = JSON.stringify(s.lit ?? {});
  root.dataset.s1Deadzone = s1Deadzone(s);
  root.dataset.connected = s.connected;
}

// ---------------- setup view ----------------
const CONTROLS = [
  ["Left stick ↔", s => s.sticks.left_x], ["Left stick ↕", s => s.sticks.left_y],
  ["Right stick ↔", s => s.sticks.right_x], ["Right stick ↕", s => s.sticks.right_y],
  ["SA", s => s.controls.SA, "switch2"], ["SB", s => s.controls.SB, "switch3", "sb"],
  ["SC", s => s.controls.SC, "switch3", "sc"], ["SD", s => s.controls.SD, "switch2"],
  ["SE", s => s.controls.SE, "switch2"], ["S1", s => s.controls.S1, "analog"],
];
const KIND = { analog: "a stick or pot", switch2: "a 2-position switch", switch3: "a 3-position switch" };
const LABEL = { left_y: "Left ↕", left_x: "Left ↔", right_y: "Right ↕", right_x: "Right ↔" };
// "CH6", or SB/SC with a channel per position: "CH11↑ CH12− CH13↓"
const MARKS = [["up", "↑"], ["mid", "−"], ["down", "↓"]];
const chName = src => src.ch ? `CH${src.ch}`
  : MARKS.filter(([k]) => src[k]).map(([k, mark]) => `CH${src[k]}${mark}`).join(" ");
function showBar(td, v) {
  const w = Math.min(Math.abs(v), 1) * 50, left = v < 0 ? 50 - w : 50; // % of the bar
  const [bar, text] = td.children;
  Object.assign(bar.firstElementChild.style, { left: `${left}%`, width: `${w}%` });
  text.textContent = `${pct(v)}%`;
}

// Where each switch lights up on the overlay: a button per position, marked like the
// overlay's labels, filled where it lights up.
const LIGHT_MARKS = { SA: ARROW[2], SB: ARROW[3], SC: ARROW[3], SD: ARROW[2], SE: ["○", "●"], S1: ["−", "0", "+"] };
const LIGHT_NAMES = {
  SA: ["up", "down"], SB: ["up", "middle", "down"], SC: ["up", "middle", "down"], SD: ["up", "down"],
  SE: ["released", "pressed"], S1: ["below its deadzone", "in its deadzone", "above its deadzone"],
};
const lightButtons = (key, lit) => `<span class="lights" role="group" aria-label="Where ${key} lights up">` +
  LIGHT_MARKS[key].map((mark, p) => {
    const name = `${key} ${LIGHT_NAMES[key][p]}`;
    return `<button type="button" data-light="${key}" data-at="${p}" aria-pressed="${!!lit[p]}" aria-label="${name}" ` +
      `title="${name}: ${lit[p] ? "lights up" : "stays dark"}">${mark}</button>`;
  }).join("") + "</span>";
$("map").onclick = e => {
  const b = e.target.closest("button[data-light]");
  if (!b) return;
  const at = [...b.parentElement.children].map(x => x.getAttribute("aria-pressed") === "true");
  at[b.dataset.at] = !at[b.dataset.at];
  b.setAttribute("aria-pressed", at[b.dataset.at]); // shown now; the server's echo redraws it
  send("set_lit", { control: b.dataset.light, at });
};

let mapBuilt; // what the table was built for; it's only rebuilt when that changes, so clicks on it aren't lost
function renderMap(s) {
  const rows = CONTROLS.map(([label, get, want, key]) => {
    const src = get(s);
    if (!src) return { label, ch: '<span class="hint">not set</span>' };
    const lit = s.lit?.[label];
    // a channel per position: the bar shows where the switch is, as one channel would
    if (!src.ch) return { label, ch: chName(src), v: (s[key] ?? 1) - 1, lit };
    const kind = s.kinds[src.ch - 1];
    // CH9-32 are on/off over USB: fine for a 2-position switch, two positions for the rest.
    const onOff = src.ch > 8 && want !== "switch2";
    // Flag channels whose behaviour doesn't match the control (e.g. SB on a 2-pos channel).
    const odd = !onOff && want && KIND[kind] && kind !== want && !(want === "switch2" && kind === "switch3");
    const ch = `CH${src.ch}${src.invert ? ' <span class="hint">reversed</span>' : ""}` +
      `${onOff ? ' <span class="hint" title="CH9-32 are on/off over USB, so this shows two positions">on/off</span>' : ""}` +
      `${odd ? ` <span class="warn" title="Moves like ${KIND[kind]}">⚠</span>` : ""}`;
    return { label, ch, v: (s.channels[src.ch - 1] ?? 0) / 1024 * (src.invert ? -1 : 1), lit };
  });
  const built = JSON.stringify(rows.map(r => [r.label, r.ch, r.v === undefined, r.lit]));
  if (built !== mapBuilt) {
    mapBuilt = built;
    $("map").innerHTML = rows.map(r => `<tr><td>${r.label}</td><td>${r.ch}</td>` +
      `<td class="now">${r.v === undefined ? "" : '<span class="mini"><i></i></span><span></span>'}</td>` +
      `<td>${r.lit ? lightButtons(r.label, r.lit) : ""}</td></tr>`).join("");
  }
  rows.forEach((r, i) => {
    const [, , now, lights] = $("map").rows[i].cells;
    if (r.v !== undefined) showBar(now, r.v);
    const here = r.label === "S1" ? s1Zone(s.s1, s1Deadzone(s)) : s[r.label.toLowerCase()];
    [...lights.querySelectorAll("button")].forEach((b, p) => b.classList.toggle("here", p === here));
  });
  showDeadzone(s1Deadzone(s), s.lit?.S1, s.controls.S1 ? s.s1 : undefined);
}

// ---------------- S1's deadzone ----------------
function showDeadzone(dz, lit, v) {
  $("s1Zones").hidden = v === undefined; // S1 not set up
  const edge = side => `${50 + side * dz / 2}%`; // the bar is S1's travel, -100% to +100%
  Object.assign($("zLow").style, { width: edge(-1) });
  Object.assign($("zMid").style, { left: edge(-1), width: `${dz}%` });
  Object.assign($("zHigh").style, { left: edge(1) });
  ["zLow", "zMid", "zHigh"].forEach((id, i) => $(id).classList.toggle("on", !!lit?.[i]));
  $("zKnobL").style.left = edge(-1);
  $("zKnobR").style.left = edge(1);
  for (const k of ["zKnobL", "zKnobR"]) {
    $(k).setAttribute("aria-valuenow", dz);
    $(k).setAttribute("aria-valuetext", `±${dz}%`);
  }
  $("zMark").style.display = v == null ? "none" : "";
  if (v != null) $("zMark").style.left = `${(Math.max(-1, Math.min(1, v)) + 1) * 50}%`;
  if (document.activeElement !== $("zIn")) $("zIn").value = dz; // not while it's being typed in
}
let dzTimer;
function chooseDeadzone(dz, dragging = false) {
  dz = Math.round(Math.max(0, Math.min(50, dz)));
  s1DzPreview = dz;
  if (document.activeElement !== $("zIn")) $("zIn").value = dz;
  for (const k of ["zKnobL", "zKnobR"]) $(k).style.left = `${50 + (k === "zKnobL" ? -1 : 1) * dz / 2}%`;
  clearTimeout(dzTimer);
  dzTimer = setTimeout(() => send("set_s1_deadzone", { percent: dz }), dragging ? 80 : 0);
}
// drag: the deadzone reaches to wherever the pointer is, either side of the middle
const dzAt = e => { const b = $("zBar").getBoundingClientRect(); return Math.abs((e.clientX - b.left) / b.width * 200 - 100); };
$("zBar").onpointerdown = e => {
  try { $("zBar").setPointerCapture(e.pointerId); } catch {}
  $("zBar").dataset.dragging = "1";
  chooseDeadzone(dzAt(e), true);
};
$("zBar").onpointermove = e => { if ($("zBar").dataset.dragging) chooseDeadzone(dzAt(e), true); };
$("zBar").onpointerup = $("zBar").onpointercancel = e => {
  if (!$("zBar").dataset.dragging) return;
  delete $("zBar").dataset.dragging;
  chooseDeadzone(dzAt(e));
};
// typed in: follows as it's typed (a number in range), and settles on Enter or leaving the
// box, a number past either end becoming that end
$("zIn").oninput = () => {
  const v = $("zIn").valueAsNumber;
  if (Number.isInteger(v) && v >= 0 && v <= 50) chooseDeadzone(v, true);
};
$("zIn").onchange = () => {
  const v = $("zIn").valueAsNumber;
  const dz = Number.isNaN(v) ? s1DzPreview ?? +$("zKnobR").getAttribute("aria-valuenow") : Math.round(Math.max(0, Math.min(50, v)));
  $("zIn").value = dz;
  chooseDeadzone(dz);
};
// keys on either knob: outward widens it, inward narrows it
for (const k of ["zKnobL", "zKnobR"]) $(k).onkeydown = e => {
  const out = +$(k).dataset.side, now = s1DzPreview ?? +$(k).getAttribute("aria-valuenow");
  const step = { ArrowRight: out, ArrowUp: 1, ArrowLeft: -out, ArrowDown: -1, PageUp: 5, PageDown: -5, Home: -50, End: 50 }[e.key];
  if (step === undefined) return;
  e.preventDefault();
  chooseDeadzone(now + step);
};

function renderSetup(s) {
  showObsUrl(s);
  $("devDot").className = "dot" + (s.demo ? " demo" : s.connected ? " on" : "");
  $("devName").textContent = s.connected ? s.name : "No radio";
  $("devName").title = s.layout || "";
  if (document.activeElement !== $("modeSel")) $("modeSel").value = String(s.mode);
  showAccentControls(accentPreview !== undefined ? accentPreview : s.accent || null);
  const parts = savedParts(s);
  $("showReadout").checked = parts.readout;
  $("modeSel").disabled = !parts.readout; // it only names the readout's values
  $("showChannels").checked = parts.channels;
  $("showLabels").checked = parts.labels;
  $("showAntenna").checked = parts.antenna;
  $("showShadow").checked = parts.shadow;
  showShadowControls(savedShadow(s), parts.shadow);
  $("obsSize").textContent = `680 × ${obsHeight(parts.readout, parts.channels)}`;
  if (s.skin_rev !== skinsRev) {
    skinsRev = s.skin_rev;
    refreshSkins(s.skin);
  } else if (document.activeElement !== $("skinSel") && $("skinSel").value !== (s.skin || "")) {
    $("skinSel").value = s.skin || "";
    showSkinRemove();
  }

  renderMap(s);

  const l = s.learn;
  const running = !!(l && l.target);
  // nothing to detect without a radio, and the demo moves every control at once
  const why = s.demo ? "Needs the real radio" : !s.connected ? "Connect the radio first" : "";
  const done = l && !running ? (l.saved && l.saved.startsWith("Saved") ? "Saved" : l.saved || "") : "";
  $("why").textContent = running ? "" : why || done;
  $("bStart").hidden = running;
  $("bStart").disabled = running || !!why;
  $("bStart").textContent = done ? "Detect again" : "Detect channels";
  $("bSkip").hidden = $("bCancel").hidden = $("bSkip").disabled = $("bCancel").disabled = !running;
  $("task").hidden = !running;
  $("step").textContent = running ? `Step ${l.step + 1} of ${l.total}` : "Channels";
  drawFocus(running ? l.target : null);
  $("root").dataset.learnTarget = running ? l.target : "";
  if (!running) return;
  $("prompt").textContent = l.prompt;
  $("hint").textContent = l.hint;
  $("holdbar").firstElementChild.style.width = `${Math.round(l.hold * 100)}%`;
  $("warn").textContent = l.ambiguous ? "More than one channel is moving"
    : (l.candidate ? `CH${l.candidate}... keep holding` : "");
  $("found").textContent = l.found.map(f =>
    `${LABEL[f.target] ?? f.target}: ${f.source ? `${chName(f.source)}${f.source.invert ? " reversed" : ""}` : "skipped"}`).join("  ·  ");
}

// What to paste into OBS: this PC's own address, or with LAN on, its name in the
// network (which works on this PC too), with its IP address in case the name isn't found.
const PORT = location.port || 80;
const urlFor = host => `http://${host.includes(":") ? `[${host}]` : host}:${PORT}/`;
let obsUrl = urlFor("127.0.0.1");
let network = null, networkFor = false; // this PC's {name, ip}, asked for when sharing starts
let lanPending = null; // switched on the page, not yet confirmed by the server
function showObsUrl(s) {
  if (lanPending !== null && (s.lan === lanPending || s.lan_error)) lanPending = null;
  $("lanOn").checked = lanPending ?? s.lan;
  if (s.lan !== networkFor) {
    networkFor = s.lan;
    network = null;
    if (s.lan) fetch("/network").then(r => r.json()).then(n => { network = n; dirty = true; }, () => {});
  }
  const name = s.lan && network?.name, ip = s.lan && network?.ip;
  obsUrl = urlFor(name || ip || "127.0.0.1");
  $("obsUrl").textContent = $("obsUrl").title = obsUrl;
  const note = $("lanNote");
  note.className = s.lan_error ? "warn" : "hint";
  note.textContent = s.lan_error
    || (!s.lan ? "Switch on LAN for OBS on another PC"
      : name && ip ? `or ${urlFor(ip)}` : network && !name && !ip ? "No network found" : "");
  note.title = note.textContent;
}
$("obsUrl").textContent = $("obsUrl").title = obsUrl;
$("lanOn").onchange = e => {
  lanPending = e.target.checked;
  send("set_lan", { on: lanPending });
};
$("copyUrl").onclick = async () => {
  const b = $("copyUrl");
  b.textContent = await navigator.clipboard.writeText(obsUrl).then(() => "Copied", () => "Select and copy it");
  setTimeout(() => (b.textContent = "Copy URL"), 1500);
};

let socket = null;
const send = (cmd, extra = {}) => socket && socket.readyState === 1 && socket.send(JSON.stringify({ cmd, ...extra }));
$("modeSel").onchange = e => send("set_mode", { mode: Number(e.target.value) });

// ---------------- accent colour ----------------
function applyAccent(colour) {
  if (colour === shownAccent) return;
  shownAccent = colour;
  if (colour) document.documentElement.style.setProperty("--accent", colour);
  else document.documentElement.style.removeProperty("--accent");
  $("root").dataset.accent = colour || "";
}
const PRESETS = [
  ["Green (default)", "#39ff88"], ["Cyan", "#00e0ff"], ["Blue", "#4d8dff"], ["Purple", "#b36bff"],
  ["Pink", "#ff4fb3"], ["Red", "#ff4d4d"], ["Orange", "#ff8a1f"], ["Yellow", "#ffd23f"], ["White", "#f2f4f7"],
];
for (const [name, colour] of PRESETS) {
  const b = document.createElement("button");
  b.className = "swatch";
  b.style.background = colour;
  b.dataset.colour = colour;
  b.dataset.test = `swatch-${colour.slice(1)}`;
  b.title = name;
  b.setAttribute("aria-label", name);
  b.onclick = () => chooseAccent(colour);
  $("swatches").appendChild(b);
}
let accentTimer;
// Shows the pick right away and tells the server (a little later while dragging the picker).
function chooseAccent(colour, dragging = false) {
  colour = colour && colour.toLowerCase() !== DEFAULT_ACCENT ? colour.toLowerCase() : null;
  accentPreview = colour;
  applyAccent(colour);
  showAccentControls(colour);
  clearTimeout(accentTimer);
  accentTimer = setTimeout(() => send("set_accent", { accent: colour }), dragging ? 80 : 0);
}
function showAccentControls(colour) {
  const c = colour || DEFAULT_ACCENT;
  $("accentHex").textContent = c;
  if (document.activeElement !== $("accentPick")) $("accentPick").value = c;
  for (const b of $("swatches").children) b.setAttribute("aria-pressed", String(b.dataset.colour === c));
  $("accentReset").disabled = $("accentReset").hidden = !colour;
}
$("accentPick").oninput = e => chooseAccent(e.target.value, true);
$("accentPick").onchange = e => chooseAccent(e.target.value);
$("accentReset").onclick = () => chooseAccent(null);
function sendShow() {
  showPreview = { readout: $("showReadout").checked, channels: $("showChannels").checked,
                  labels: $("showLabels").checked, antenna: $("showAntenna").checked, shadow: $("showShadow").checked };
  send("set_show", showPreview);
}
for (const id of ["showReadout", "showChannels", "showLabels", "showAntenna", "showShadow"]) $(id).onchange = sendShow;

const SLIDER = { angle: "shAngle", distance: "shDistance", blur: "shBlur", strength: "shStrength" };
const SHOWN = { angle: v => `<i class="dir" style="transform: rotate(${v}deg)">↑</i>${v}°`, distance: v => v, blur: v => v, strength: v => `${v}%` };
function showShadowControls(sh, on) {
  for (const k of SHADOW_KEYS) {
    const input = $(SLIDER[k]);
    if (document.activeElement !== input) input.value = sh[k];
    input.disabled = !on;
    input.style.setProperty("--fill", `${(input.value - input.min) / (input.max - input.min) * 100}%`);
    $(`${SLIDER[k]}Out`).innerHTML = SHOWN[k](input.value);
  }
  $("shadowReset").disabled = !on || SHADOW_KEYS.every(k => sh[k] === SHADOW_DEFAULT[k]);
}
let shadowTimer;
function chooseShadow(sh, dragging = false) {
  shadowPreview = sh;
  applyShadowLook(sh);
  showShadowControls(sh, $("showShadow").checked);
  clearTimeout(shadowTimer);
  shadowTimer = setTimeout(() => send("set_shadow", sh), dragging ? 80 : 0);
}
const slidersNow = () => Object.fromEntries(SHADOW_KEYS.map(k => [k, Number($(SLIDER[k]).value)]));
for (const k of SHADOW_KEYS) {
  $(SLIDER[k]).oninput = () => chooseShadow(slidersNow(), true);
  $(SLIDER[k]).onchange = () => chooseShadow(slidersNow());
}
$("shadowReset").onclick = () => chooseShadow({ ...SHADOW_DEFAULT });
$("shadowAdjust").onclick = () => {
  const open = $("shadowPanel").hidden;
  $("shadowPanel").hidden = !open;
  $("shadowAdjust").setAttribute("aria-expanded", open);
  document.body.classList.toggle("shadow-preview", open);
};

// ---------------- skins ----------------
// A skin wraps the radio's body like a vinyl skin: any PNG, scaled to cover the body and
// cropped to its outline. Everything else (bezels, buttons, screen, sticks) stays on top.
function applySkin(name, rev) {
  const key = name ? `${name}@${rev}` : "";
  if (key === shownSkin) return;
  shownSkin = key;
  const show = (href, skinName) => {
    const img = $("skinImage");
    if (href) img.setAttribute("href", href);
    else img.removeAttribute("href");
    $("root").classList.toggle("skinned", !!href);
    $("root").dataset.skin = skinName || "";
  };
  if (!name) return show(null);
  // Load it fully first, so switching never flashes an empty radio; a missing or broken
  // skin leaves the built-in drawing up.
  const href = `/skins/${encodeURIComponent(name)}?rev=${rev}`;
  const probe = new Image();
  probe.onload = () => probe.decode().catch(() => {}).then(() => { if (shownSkin === key) show(href, name); });
  probe.onerror = () => { if (shownSkin === key) show(null); };
  probe.src = href;
}

async function refreshSkins(selected) {
  const names = await fetch("/skins").then(r => r.json()).catch(() => []);
  const sel = $("skinSel");
  sel.replaceChildren(new Option("None", ""), ...names.map(n => new Option(n, n)));
  sel.value = names.includes(selected) ? selected : "";
  showSkinRemove();
}
function showSkinRemove() {
  $("skinRemove").disabled = $("skinRemove").hidden = !$("skinSel").value;
}
let skinMsgTimer;
function skinMsg(text) {
  $("skinMsg").textContent = text;
  clearTimeout(skinMsgTimer);
  skinMsgTimer = setTimeout(() => ($("skinMsg").textContent = ""), 4000);
}
$("skinSel").onchange = e => {
  send("set_skin", { skin: e.target.value || null });
  showSkinRemove();
};
$("skinFile").onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const name = file.name.replace(/\.png$/i, "").replace(/[^A-Za-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "skin";
  const r = await fetch(`/skins/${name}`, { method: "PUT", headers: { "Content-Type": "image/png" }, body: file });
  skinMsg(r.ok ? "Uploaded" : await r.text());
  if (r.ok) send("set_skin", { skin: name });
  e.target.value = "";
};
$("skinRemove").onclick = async () => {
  const name = $("skinSel").value;
  if (!name) return;
  const r = await fetch(`/skins/${name}`, { method: "DELETE" });
  skinMsg(r.ok ? "Deleted" : await r.text());
};

$("bStart").onclick = () => send("learn_start");
$("bSkip").onclick = () => send("learn_skip");
$("bCancel").onclick = () => send("learn_cancel");
addEventListener("keydown", e => {
  if (!SETUP) return;
  if (e.key === "s" || e.key === "S") send("learn_skip");
  if (e.key === "Escape") send("learn_cancel");
});

// ---------------- render loop: newest state, once per frame ----------------
let latest = null, dirty = false;
function frame() {
  requestAnimationFrame(frame);
  if (!dirty || !latest) return;
  dirty = false;
  render(latest);
}
requestAnimationFrame(frame);

// ---------------- websocket, auto-reconnect ----------------
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  socket = ws;
  ws.onmessage = e => { latest = JSON.parse(e.data); dirty = true; };
  ws.onclose = () => {
    if (latest) { latest = { ...latest, connected: false }; dirty = true; }
    setTimeout(connect, 1000);
  };
}
// ?nosocket=1: no server; an embedding page drives it through overlaySetState(state).
window.overlaySetState = s => { latest = s; dirty = true; };
if (q.get("nosocket") === "1") {
  addEventListener("message", e => { if (e.data && e.data.overlayState) window.overlaySetState(e.data.overlayState); });
} else {
  connect();
}
</script>
