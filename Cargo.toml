[package]
name = "pocket-overlay"
version = "0.1.7"
edition = "2024"
description = "OBS overlay showing a RadioMaster Pocket's sticks and switches live, read over USB"

[profile.release]
strip = true
lto = "thin"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
gethostname = "1"
# macos-shared-device: don't take the radio away from games/sims on macOS
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
toml = "1.1.6"
webbrowser = "1"

[dev-dependencies]
futures-util = "0.3.34"
headless_chrome = "1.0.22"
png = "0.18.1"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.6"

# the virtual-radio test (tests/uhid.rs) talks to /dev/uhid and evdev directly
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
